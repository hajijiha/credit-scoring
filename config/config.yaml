# 대안신용평가 ML 시스템 - 단일 설정 파일
# 규칙: 모든 설정값은 이 파일에만 둔다. 코드에 상수를 하드코딩하지 않는다.
# 규칙: 모든 경로는 프로젝트 루트 기준 상대경로다. 절대경로 금지.

project:
  name: credit-scoring
  random_state: 42

paths:
  data_raw: data/raw
  models: models
  mlruns: mlruns

data:
  main_dataset: gmsc                       # ADR-006
  gmsc_file: cs-training.csv
  target_column: SeriousDlqin2yrs

ports:
  api: 8000
  dashboard: 8501
  mlflow: 5000

split:
  train: 0.70
  valid: 0.15
  test: 0.15
  random_state: 42
  stratify: true

thresholds:
  approval_threshold: 0.30                 # p_default < 0.30 이면 승인 (ADR-003)
  di_ratio_min: 0.80                       # Disparate Impact 하한
  di_ratio_max: 1.25                       # Disparate Impact 상한
  eo_diff_max: 0.10                        # Equalized Odds 차이 상한

scoring:
  # score = 1000 * (1 - p_default)  (ADR-003)
  score_max: 1000
  grade_cutoffs:                           # 이상(>=) 기준, 미달 시 E
    A: 800
    B: 650
    C: 500
    D: 350

simulator:
  thin_filer_ratio: 0.30                   # ADR-001
  bias_ratio: 0.30                         # ADR-002 v3 (상한. 그 이상은 상관 요건 위반)
  random_state: 42
  alternative_features:
    - telecom_payment_rate
    - utility_payment_rate
    - spending_consistency
    - regular_payment_count
    - app_login_frequency
  target_correlation:                      # SPEC §4 요건. 검증 시 이 범위 안에 있어야 한다.
    min: 0.30
    max: 0.50
  generation_correlation:                  # ADR-001 v2: 실제 생성 목표는 요건 범위의 하단만 쓴다
    min: 0.31                              # 하한 0.30 에 여유. 편향 주입 후에도 0.30 이상 유지
    max: 0.35
  latent_factor_strength: 0.85             # ADR-001 v2: 대안 5변수가 공유하는 '성실성' 잠재요인 비중
  thin_filer_masked_columns:               # 씬파일러에게 결측 처리할 연체 컬럼
    - NumberOfTime30-59DaysPastDueNotWorse
    - NumberOfTime60-89DaysPastDueNotWorse
    - NumberOfTimes90DaysLate
  thin_filer_noised_columns:               # 씬파일러에게 강한 노이즈를 주입할 컬럼
    - RevolvingUtilizationOfUnsecuredLines
    - NumberOfOpenCreditLinesAndLoans
  thin_filer_noise:                        # 노이즈 강도
    revolving_lognormal_sigma: 1.0         # RevolvingUtilization: x * exp(N(0, sigma))
    open_credit_lines_sigma: 4.0           # NumberOfOpenCreditLinesAndLoans: x + round(N(0, sigma)), 0 이상
  thin_filer_flag_column: is_thin_filer
  thin_filer_min_missing: 2                # 연체 관련 컬럼 2개 이상 결측이면 씬파일러 (스펙 정의)
  thin_filer_type_column: thin_filer_type
  thin_filer_type_mix:                     # ADR-010: 씬파일러 내부 유형 분포 (합 1.0)
    missing_only: 0.40                     # 연체 3컬럼만 결측, 거래 이력은 정상
    history_only: 0.30                     # 거래 이력만 12개월 미만, 연체 컬럼은 관측됨
    both: 0.30                             # 두 조건 모두 해당
  credit_history:                          # ADR-009: 신용카드 거래 이력 개월수
    column: credit_history_months
    min_months_for_normal: 12              # 12개월 미만이면 씬파일러 (스펙 §4)
    thin_range: [3, 11]
    normal_range: [12, 120]
    age_weight: 0.35                       # age 와의 약한 양의 상관
  gender_column: gender
  age_group_column: age_group
  age_group_bins:                          # [하한, 상한) — 상한 null 은 무한대
    - {label: "20-34", min: 18, max: 35}
    - {label: "35-54", min: 35, max: 55}
    - {label: "55+",   min: 55, max: null}
  biased_features:                         # ADR-002: 측정 편향을 주입할 대안 피처
    - telecom_payment_rate
    - utility_payment_rate
  bias_shift_per_ratio: 0.3                # 하향폭 = bias_ratio * 이 값 (집단별로 가산). ADR-002 v2

fairness:
  library: fairlearn                       # AIF360 금지 (ADR-004 / Python 3.12 비호환)
  sensitive_attributes:
    - gender
    - age_group
  groups:
    gender: [male, female]
    age_group: ["20-34", "35-54", "55+"]
  disadvantaged_groups:                    # ADR-002 v2 에서 측정 편향을 주입하는 집단
    gender: female
    age_group: "20-34"
  mitigation:
    method: threshold_optimizer            # Fairlearn ThresholdOptimizer (ADR-004)
    constraints: equalized_odds
    # ADR-004 v2: accuracy 최대화는 부도율 6.7% 에서 '거의 전부 승인'이 최적해가 된다.
    objective: balanced_accuracy_score

cv:
  n_splits: 5                              # RepeatedStratifiedKFold (ADR-005)
  n_repeats: 4                             # 그룹당 관측치 n = 5 x 4 = 20
  random_state: 42

api:
  title: 대안신용평가 API
  version: 1.0.0
  description: >-
    씬파일러 대상 대안신용평가 시스템. 본 시스템은 교육 목적으로 개발되었으며,
    실제 금융 의사결정에 사용할 수 없습니다.
  # 사전 계산 결과를 읽어 서빙한다. 요청 시 재계산하지 않는다.
  precomputed:
    fairness: fairness/fairness_results.json
    anova: anova_results.json
    model_results: model_results.csv
    uplift: thin_filer_uplift.csv

dashboard:
  # 기본 입력값은 F3 의 borderline_rejected 샘플(p_default 0.375, 씬파일러 both 유형).
  # 극단 사례(p=0.97)보다 경계 사례가 XAI 가치를 잘 보여준다.
  default_input:
    RevolvingUtilizationOfUnsecuredLines: 0.0094
    age: 66
    DebtRatio: 0.1998
    MonthlyIncome: 13300
    NumberOfOpenCreditLinesAndLoans: 20
    NumberRealEstateLoansOrLines: 2
    NumberOfDependents: 1
    NumberOfTime30-59DaysPastDueNotWorse: null   # 기록 없음(씬파일러)
    NumberOfTime60-89DaysPastDueNotWorse: null
    NumberOfTimes90DaysLate: null
    telecom_payment_rate: 0.6836
    utility_payment_rate: 0.6731
    spending_consistency: 0.2527
    regular_payment_count: 7
    app_login_frequency: 6
    gender: male
    credit_history_months: 11
  risk_colors:                             # SPEC §7: 위험도별 색상 구분
    low: "#2E7D32"                         # 저위험 초록
    medium: "#F9A825"                      # 중위험 노랑
    high: "#C62828"                        # 고위험 빨강
  risk_bands:                              # 부도 확률 기준
    low_max: 0.15
    medium_max: 0.30                       # 이상이면 고위험(= 승인 임계값)
  request_timeout_seconds: 10
  static_assets_dir: docs/report_assets     # 사전 생성 이미지(모델 파일 아님)

explainer:
  feature_names_file: config/feature_names.yaml
  output_dir: data/processed/explain     # 산출물 원본
  report_assets_dir: docs/report_assets  # 리포트용 복사본
  summary_max_display: 15                # SPEC §3: 상위 15개 변수
  dependence_features:                   # 대안 1개 + 전통 1개로 대비 (SPEC §3: 최소 2개)
    - telecom_payment_rate
    - RevolvingUtilizationOfUnsecuredLines
  top_rejection_reasons: 5               # SPEC §3: 거절 사유 Top 5
  background_sample_size: 2000           # SHAP 계산용 표본
  reference_group_column: age_group      # reference_value = 동일 연령대 평균
  # 설명 샘플. p=0.9997 같은 자명한 건은 XAI 가치를 보여주지 못하므로 경계 구간도 함께 저장한다.
  samples:
    - {name: extreme_rejected_thin_filer, segment: thin_filer, decision: rejected, proba_min: 0.95, proba_max: 1.01}
    - {name: extreme_rejected_normal,      segment: normal,     decision: rejected, proba_min: 0.95, proba_max: 1.01}
    - {name: borderline_rejected,          segment: any,        decision: rejected, proba_min: 0.30, proba_max: 0.45}
    - {name: borderline_approved,          segment: any,        decision: approved, proba_min: 0.20, proba_max: 0.30}

anova:
  alpha: 0.05                              # 유의수준. p < alpha 이면 Tukey HSD 수행
  eta_squared_thresholds:                  # 효과크기 해석 기준 (SPEC §5)
    small: 0.01
    medium: 0.06
    large: 0.14
  eta_squared_extreme: 0.90                # 이 값을 넘으면 해석에 경고를 붙인다
  fold_auc_file: fold_auc.csv
  result_file: anova_results.json
  # ADR-011: 교락을 피하려고 나머지 요인을 고정한다. 고정 값은 champion 조합을 따른다.
  tests:
    test_1_feature_group:
      name: "피처 그룹별 AUC 비교 (One-way ANOVA)"
      factor: feature_group
      control:
        algorithm: xgboost
        imbalance: class_weight
    test_2_algorithm:
      name: "알고리즘별 AUC 비교 (One-way ANOVA)"
      factor: algorithm
      control:
        feature_group: combined
        imbalance: class_weight

features:
  # ADR-008: 보호 속성은 학습 피처에서 제외한다. ADR-009: 씬파일러 판정 근거 컬럼도 제외한다.
  traditional:                             # GMSC 원본 전통 신용 피처
    - RevolvingUtilizationOfUnsecuredLines
    - age
    - NumberOfTime30-59DaysPastDueNotWorse
    - DebtRatio
    - MonthlyIncome
    - NumberOfOpenCreditLinesAndLoans
    - NumberOfTimes90DaysLate
    - NumberRealEstateLoansOrLines
    - NumberOfTime60-89DaysPastDueNotWorse
    - NumberOfDependents
  alternative:                             # 대안 데이터 5변수
    - telecom_payment_rate
    - utility_payment_rate
    - spending_consistency
    - regular_payment_count
    - app_login_frequency
  protected:                               # 학습 제외. 공정성 평가 / ThresholdOptimizer 전용 (ADR-008)
    - gender
    - age_group
  segment:                                 # 학습 제외. 집단 분리 평가 전용 (ADR-009, ADR-010)
    - is_thin_filer
    - thin_filer_type
    - credit_history_months
  include_missing_flags_in: traditional    # 연체 결측 플래그는 전통 피처 그룹에 포함

models:
  # 하이퍼파라미터도 코드가 아니라 여기서 읽는다.
  algorithms: [logistic_regression, xgboost, lightgbm]
  imbalance_methods: [class_weight, smote]
  feature_groups: [traditional_only, alternative_only, combined]
  model_version: v1.0
  # 최종 채택 조합. test AUC 최고(=smote)가 아니라 설명가능성 기준으로 고른다.
  # 근거: ADR-001 "부기: 불균형 처리 기법" — SMOTE 는 합성 샘플로 학습해
  # SHAP 기여도를 거절 사유로 제시하기에 부적합(신용정보법 제36조의2 설명 의무).
  champion:
    algorithm: xgboost
    feature_group: combined
    imbalance: class_weight
  n_jobs: 4                                # 14코어 환경에서 4가 가장 빠름(스레드 경합 회피)
  logistic_regression:
    solver: lbfgs
    max_iter: 1000
  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
  lightgbm:
    n_estimators: 300
    num_leaves: 31
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8

preprocess:
  # 중앙값 대체 대상. 연체 3컬럼은 여기에 넣지 않는다(아래 사유 참조).
  median_impute_columns:
    - MonthlyIncome
    - NumberOfDependents
  # 씬파일러의 연체 컬럼 결측은 '정보 없음'이라는 신호 자체다. 중앙값으로 채우면
  # 씬파일러를 평균적인 우량 고객으로 위장시키게 되므로 센티넬 값 + 결측 플래그로 보존한다.
  missing_indicator_columns:
    - NumberOfTime30-59DaysPastDueNotWorse
    - NumberOfTime60-89DaysPastDueNotWorse
    - NumberOfTimes90DaysLate
  missing_sentinel: -1
  missing_flag_suffix: _is_missing
  categorical_columns: []                  # ADR-008: 보호 속성은 One-Hot 하지 않는다(학습 미사용)
  passthrough_columns:                     # 스케일링/인코딩 없이 원본 그대로 유지할 컬럼
    - is_thin_filer
    - thin_filer_type
    - credit_history_months
    - gender
    - age_group
  scaler: standard                         # standard | minmax
  output_dir: data/processed
  scaler_file: preprocessor.joblib

mlflow:
  # MLflow 3.x 는 파일 저장소를 유지보수 모드로 막았다. SQLite 백엔드를 쓴다.
  # (Model Registry 도 파일 저장소에서는 지원되지 않는다.)
  tracking_uri: sqlite:///mlflow.db
  # 상대경로로 둔다. 절대경로로 기록하면 호스트에서 만든 run 의 아티팩트 링크가
  # 컨테이너 안에서 깨진다(경로가 다르다).
  artifact_location: ./mlruns
  experiment_name: credit-scoring
  registered_model_name: credit-scoring-champion
