# docker compose up  →  api(8000) + dashboard(8501) + mlflow(5000)
#
# 학습 산출물(models/, data/processed/, mlruns/)은 .gitignore 대상이라 클론 직후에는 없다.
# 먼저 아래를 한 번 실행해 산출물을 만든다(약 15분).
#
#   docker compose --profile setup run --rm bootstrap
#
# 자세한 설명은 README.md "실행 방법" 참조.

x-common: &common
  build:
    context: .
    # 이 환경의 BuildKit 빌더는 기본 네트워크에서 DNS 해석에 실패한다
    # ("Could not resolve 'deb.debian.org'"). 호스트 네트워크로 빌드한다.
    network: host
  image: credit-scoring:latest
  env_file:
    - path: .env
      required: false
  volumes:
    # 소스와 산출물을 바인드 마운트한다. 산출물이 리포지토리에 없기 때문에
    # 이미지에 굽는 방식은 클론 직후 빌드에서 성립하지 않는다.
    - .:/app
  working_dir: /app

services:
  # 데이터 다운로드 → 시뮬레이션 → 전처리 → 학습 → 설명/공정성/통계 산출물 생성.
  # 프로파일에 묶어 두어 `docker compose up` 에서는 실행되지 않는다.
  bootstrap:
    <<: *common
    profiles: ["setup"]
    command: ["bash", "scripts/bootstrap.sh"]

  api:
    <<: *common
    command:
      - uvicorn
      - src.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s

  dashboard:
    <<: *common
    environment:
      # 컨테이너 네트워크 이름으로 API 를 찾는다.
      API_BASE_URL: http://api:8000
    command:
      - streamlit
      - run
      - src/dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  mlflow:
    <<: *common
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////app/mlflow.db
      - --default-artifact-root
      - /app/mlruns
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
